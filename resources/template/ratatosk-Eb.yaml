# =======================================================
# 1. 机场订阅 Proxy Providers
# =======================================================

# ── 手动订阅示例 / Manual Providers ──
# 手动启用时取消下方整段注释；添加机场时复制 xyang 层级，并修改订阅名称保证唯一
# url 填写实际节点订阅地址；支持的订阅格式以当前 Mihomo 内核为准
# proxy-providers:  # 远程节点订阅入口
#   xyang:  # 订阅名称，供策略组引用或自动汇入使用
#     url: "https://example.com/sub?token=YOUR_SUBSCRIPTION_TOKEN"  # 机场提供的节点订阅地址
#     type: http  # HTTP 型订阅，下载远程节点内容
#     interval: 86400  # 订阅更新间隔：86400 秒 / 24 小时
#     health-check: {enable: true, lazy: true, url: "https://www.gstatic.com/generate_204", interval: 3600}  # 启用延迟测试，间隔 3600 秒；lazy 表示未使用时不主动定时测速
#     proxy: DIRECT  # 订阅下载 / 更新使用的出口：直连

# ── 自动订阅区域 / Auto Providers ──
# 预留自动写入区域；使用自动注入功能时保留下面的起止标记
# >>> AUTO-PROVIDERS-START

# <<< AUTO-PROVIDERS-END


# =======================================================
# 2. 基础设置 General
# =======================================================

port: 7890                           # HTTP 代理端口
socks-port: 7891                     # SOCKS5 代理端口
allow-lan: true                      # 允许局域网设备访问代理端口
mode: rule                           # 规则模式，按下方 rules 列表分流
log-level: info                      # 日志级别：info，记录一般运行及连接信息
unified-delay: true                 # 统一延迟计算，优先取复用连接的请求耗时，排除握手等额外延迟
external-controller: 127.0.0.1:9090  # REST API 监听地址：仅本机访问


# =======================================================
# 3. 手动节点 Proxies
# =======================================================

# 下方仅为节点名称占位，当前整段未启用
# 启用时取消注释，并补全 type / server / port 及对应协议参数；多个节点的 name 需保持唯一
# proxies:
#   - name: "手动节点1"
#   - name: "手动节点2"


# =======================================================
# 4. 节点筛选 Node Filters
# =======================================================

# ── 地区匹配 / Regions ──
# 以下为 YAML 正则锚点，供策略组的 filter 引用；按节点名称匹配，忽略英文大小写
# 各地区正则排除名称以 => 开头的节点；地区代码支持末尾紧跟数字
# 按节点名称独立筛选；名称含多个地区标记时可能进入多个组，实际落地以机场标注为准
FilterHK: &FilterHK '(?i)^(?!=>).*(?:🇭🇰|香港|Hong\s?Kong|\b(?:HK|HKG)\d*\b)'  # 香港：国旗 / 香港 / Hong Kong / HK / HKG
FilterTW: &FilterTW '(?i)^(?!=>).*(?:🇹🇼|台湾|Tai(?:wan)?|\b(?:TW|TWN)\d*\b)'  # 台湾：国旗 / 台湾 / Tai / Taiwan / TW / TWN
FilterMO: &FilterMO '(?i)^(?!=>).*(?:🇲🇴|澳门|澳門|\b(?:Maca[ou])\b|\b(?:MO|MAC)\d*\b)'  # 澳门：国旗 / 中英文名称及部分城市名 / MO / MAC
FilterJP: &FilterJP '(?i)^(?!=>).*(?:🇯🇵|日本|川日|东京|大阪|埼玉|Japan|\b(?:JP|JPN)\d*\b)'  # 日本：国旗 / 日本及部分城市名 / Japan / JP / JPN
FilterKR: &FilterKR '(?i)^(?!=>).*(?:🇰🇷|韩国|韓|首尔|Korea|\b(?:KR|KOR)\d*\b)'  # 韩国：国旗 / 韩国 / 韓 / 首尔 / Korea / KR / KOR
FilterSG: &FilterSG '(?i)^(?!=>).*(?:🇸🇬|新加坡|狮|Singapore|\b(?:SG|SGP)\d*\b)'  # 新加坡：国旗 / 新加坡 / 狮 / Singapore / SG / SGP
FilterTH: &FilterTH '(?i)^(?!=>).*(?:🇹🇭|泰国|泰國|曼谷|\b(?:Thailand|Bangkok)\b|\b(?:TH|THA)\d*\b)'  # 泰国：国旗 / 中英文名称及部分城市名 / TH / THA
FilterMY: &FilterMY '(?i)^(?!=>).*(?:🇲🇾|马来(?:西亚)?|馬來(?:西亞)?|大马|大馬|吉隆坡|\b(?:Malaysia|Kuala\s?Lumpur)\b|\b(?:MY|MYS)\d*\b)'  # 马来西亚：国旗 / 中英文名称及部分城市名 / MY / MYS
FilterVN: &FilterVN '(?i)^(?!=>).*(?:🇻🇳|越南|胡志明|河内|河內|\b(?:Vietnam|Viet\s?Nam|Hanoi|Ho\s?Chi\s?Minh)\b|\b(?:VN|VNM)\d*\b)'  # 越南：国旗 / 中英文名称及部分城市名 / VN / VNM
FilterPH: &FilterPH '(?i)^(?!=>).*(?:🇵🇭|菲律宾|菲律賓|马尼拉|馬尼拉|宿务|宿霧|\b(?:Philippines|Manila|Cebu)\b|\b(?:PH|PHL)\d*\b)'  # 菲律宾：国旗 / 中英文名称及部分城市名 / PH / PHL
FilterID: &FilterID '(?i)^(?!=>).*(?:🇮🇩|印度尼西亚|印度尼西亞|印尼|雅加达|雅加達|巴厘岛|峇里島|\b(?:Indonesia|Jakarta|Bali)\b|\b(?:ID|IDN)\d*\b)'  # 印度尼西亚：国旗 / 中英文名称及部分城市名 / ID / IDN
FilterIN: &FilterIN '(?i)^(?!=>).*(?:🇮🇳|印度(?!尼)|孟买|孟買|新德里|班加罗尔|班加羅爾|\b(?:India|Mumbai|New\s?Delhi|Bangalore|Bengaluru)\b|\b(?:IN|IND)\d*\b)'  # 印度：国旗 / 印度（排除印尼） / 部分城市名 / India / IN / IND
FilterAU: &FilterAU '(?i)^(?!=>).*(?:🇦🇺|澳大利亚|澳大利亞|澳洲|悉尼|雪梨|墨尔本|墨爾本|珀斯|布里斯班|\b(?:Australia|Sydney|Melbourne|Perth|Brisbane)\b|\b(?:AU|AUS)\d*\b)'  # 澳大利亚：国旗 / 中英文名称及部分城市名 / AU / AUS
FilterUS: &FilterUS '(?i)^(?!=>).*(?:🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|拉斯维加斯|United States|\b(?:US|USA)\d*\b)'  # 美国：国旗 / 美国及部分城市名 / United States / US / USA
FilterCA: &FilterCA '(?i)^(?!=>).*(?:🇨🇦|加拿大|多伦多|多倫多|温哥华|溫哥華|蒙特利尔|蒙特利爾|渥太华|渥太華|\b(?:Canada|Toronto|Vancouver|Montreal|Ottawa)\b|\b(?:CA|CAN)\d*\b)'  # 加拿大：国旗 / 中英文名称及部分城市名 / CA / CAN
FilterUK: &FilterUK '(?i)^(?!=>).*(?:🇬🇧|英国|英國|伦敦|倫敦|曼彻斯特|曼徹斯特|\b(?:United\s?Kingdom|Great\s?Britain|Britain|England|London|Manchester)\b|\b(?:UK|GB|GBR)\d*\b)'  # 英国：国旗 / 中英文名称及部分城市名 / UK / GB / GBR
FilterDE: &FilterDE '(?i)^(?!=>).*(?:🇩🇪|德国|德國|法兰克福|法蘭克福|柏林|慕尼黑|\b(?:Germany|Deutschland|Frankfurt|Berlin|Munich)\b|\b(?:DE|DEU)\d*\b)'  # 德国：国旗 / 中英文名称及部分城市名 / DE / DEU
FilterFR: &FilterFR '(?i)^(?!=>).*(?:🇫🇷|法国|法國|巴黎|里昂|\b(?:France|Paris|Lyon)\b|\b(?:FR|FRA)\d*\b)'  # 法国：国旗 / 中英文名称及部分城市名 / FR / FRA
FilterNL: &FilterNL '(?i)^(?!=>).*(?:🇳🇱|荷兰|荷蘭|阿姆斯特丹|鹿特丹|\b(?:Netherlands|Holland|Amsterdam|Rotterdam)\b|\b(?:NL|NLD)\d*\b)'  # 荷兰：国旗 / 中英文名称及部分城市名 / NL / NLD
FilterCH: &FilterCH '(?i)^(?!=>).*(?:🇨🇭|瑞士|苏黎世|蘇黎世|日内瓦|日內瓦|\b(?:Switzerland|Swiss|Zurich|Geneva)\b|\b(?:CH|CHE)\d*\b)'  # 瑞士：国旗 / 中英文名称及部分城市名 / CH / CHE
FilterRU: &FilterRU '(?i)^(?!=>).*(?:🇷🇺|俄罗斯|俄羅斯|莫斯科|圣彼得堡|聖彼得堡|\b(?:Russia|Moscow|Saint\s?Petersburg)\b|\b(?:RU|RUS)\d*\b)'  # 俄罗斯：国旗 / 中英文名称及部分城市名 / RU / RUS
FilterTR: &FilterTR '(?i)^(?!=>).*(?:🇹🇷|土耳其|伊斯坦布尔|伊斯坦布爾|伊斯坦堡|安卡拉|\b(?:Turkey|Türkiye|Turkiye|Istanbul|Ankara)\b|\b(?:TR|TUR)\d*\b)'  # 土耳其：国旗 / 中英文名称及部分城市名 / TR / TUR
FilterBR: &FilterBR '(?i)^(?!=>).*(?:🇧🇷|巴西|圣保罗|聖保羅|里约|里約|\b(?:Brazil|Brasil|S[aã]o\s?Paulo|Rio\s?de\s?Janeiro)\b|\b(?:BR|BRA)\d*\b)'  # 巴西：国旗 / 中英文名称及部分城市名 / BR / BRA
FilterAR: &FilterAR '(?i)^(?!=>).*(?:🇦🇷|阿根廷|布宜诺斯艾利斯|布宜諾斯艾利斯|\b(?:Argentina|Buenos\s?Aires)\b|\b(?:AR|ARG)\d*\b)'  # 阿根廷：国旗 / 中英文名称及部分城市名 / AR / ARG

# ── 节点净化 / Clean Filter ──
# 按名称排除广告 / 流量 / 到期等关键词，以及名称任意位置的 => 标记
# 仅作用于显式引用此锚点的策略组；匹配关键词的真实节点也会被过滤
FilterAll: &FilterAll '^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$'  # 手动切换 / 自动选择 / 故障转移 / 两类负载均衡共用

# ── 其他地区 / Others ──
# 应用 FilterAll 的节点净化，并排除以上 24 个已分类国家 / 地区
FilterOthers: &FilterOthers '(?i)^(?!.*(?:🇭🇰|香港|Hong\s?Kong|\b(?:HK|HKG)\d*\b|🇹🇼|台湾|Tai(?:wan)?|\b(?:TW|TWN)\d*\b|🇲🇴|澳门|澳門|\b(?:Maca[ou])\b|\b(?:MO|MAC)\d*\b|🇯🇵|日本|川日|东京|大阪|埼玉|Japan|\b(?:JP|JPN)\d*\b|🇰🇷|韩国|韓|首尔|Korea|\b(?:KR|KOR)\d*\b|🇸🇬|新加坡|狮|Singapore|\b(?:SG|SGP)\d*\b|🇹🇭|泰国|泰國|曼谷|\b(?:Thailand|Bangkok)\b|\b(?:TH|THA)\d*\b|🇲🇾|马来(?:西亚)?|馬來(?:西亞)?|大马|大馬|吉隆坡|\b(?:Malaysia|Kuala\s?Lumpur)\b|\b(?:MY|MYS)\d*\b|🇻🇳|越南|胡志明|河内|河內|\b(?:Vietnam|Viet\s?Nam|Hanoi|Ho\s?Chi\s?Minh)\b|\b(?:VN|VNM)\d*\b|🇵🇭|菲律宾|菲律賓|马尼拉|馬尼拉|宿务|宿霧|\b(?:Philippines|Manila|Cebu)\b|\b(?:PH|PHL)\d*\b|🇮🇩|印度尼西亚|印度尼西亞|印尼|雅加达|雅加達|巴厘岛|峇里島|\b(?:Indonesia|Jakarta|Bali)\b|\b(?:ID|IDN)\d*\b|🇮🇳|印度(?!尼)|孟买|孟買|新德里|班加罗尔|班加羅爾|\b(?:India|Mumbai|New\s?Delhi|Bangalore|Bengaluru)\b|\b(?:IN|IND)\d*\b|🇦🇺|澳大利亚|澳大利亞|澳洲|悉尼|雪梨|墨尔本|墨爾本|珀斯|布里斯班|\b(?:Australia|Sydney|Melbourne|Perth|Brisbane)\b|\b(?:AU|AUS)\d*\b|🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|拉斯维加斯|United States|\b(?:US|USA)\d*\b|🇨🇦|加拿大|多伦多|多倫多|温哥华|溫哥華|蒙特利尔|蒙特利爾|渥太华|渥太華|\b(?:Canada|Toronto|Vancouver|Montreal|Ottawa)\b|\b(?:CA|CAN)\d*\b|🇬🇧|英国|英國|伦敦|倫敦|曼彻斯特|曼徹斯特|\b(?:United\s?Kingdom|Great\s?Britain|Britain|England|London|Manchester)\b|\b(?:UK|GB|GBR)\d*\b|🇩🇪|德国|德國|法兰克福|法蘭克福|柏林|慕尼黑|\b(?:Germany|Deutschland|Frankfurt|Berlin|Munich)\b|\b(?:DE|DEU)\d*\b|🇫🇷|法国|法國|巴黎|里昂|\b(?:France|Paris|Lyon)\b|\b(?:FR|FRA)\d*\b|🇳🇱|荷兰|荷蘭|阿姆斯特丹|鹿特丹|\b(?:Netherlands|Holland|Amsterdam|Rotterdam)\b|\b(?:NL|NLD)\d*\b|🇨🇭|瑞士|苏黎世|蘇黎世|日内瓦|日內瓦|\b(?:Switzerland|Swiss|Zurich|Geneva)\b|\b(?:CH|CHE)\d*\b|🇷🇺|俄罗斯|俄羅斯|莫斯科|圣彼得堡|聖彼得堡|\b(?:Russia|Moscow|Saint\s?Petersburg)\b|\b(?:RU|RUS)\d*\b|🇹🇷|土耳其|伊斯坦布尔|伊斯坦布爾|伊斯坦堡|安卡拉|\b(?:Turkey|Türkiye|Turkiye|Istanbul|Ankara)\b|\b(?:TR|TUR)\d*\b|🇧🇷|巴西|圣保罗|聖保羅|里约|里約|\b(?:Brazil|Brasil|S[aã]o\s?Paulo|Rio\s?de\s?Janeiro)\b|\b(?:BR|BRA)\d*\b|🇦🇷|阿根廷|布宜诺斯艾利斯|布宜諾斯艾利斯|\b(?:Argentina|Buenos\s?Aires)\b|\b(?:AR|ARG)\d*\b))(?!.*(?:=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$'  # 仅收纳未命中上述地区的净化节点

# =======================================================
# 5. 策略组 Proxy Groups
# =======================================================

# include-all 汇入手动节点及订阅节点；filter 仅在当前组内按节点名称筛选
# select 为手动选择，首项为初始选项；标注预留的策略组当前未被规则或其他策略组引用
# 应用范围由下方 rules 实际命中决定；图标使用 macOSicons PNG，来源见 icons/macosicons/manifest.json
proxy-groups:

  # ── 策略入口 / Switch ──
  - {name: 🎚️ 节点选择,   type: select, proxies: [♻️ 自动选择, 🔯 故障转移, 🔮 负载均衡, 🌆, 🧋, 🎰, ⛩️, 🎤, 🏙️, 🐘, 🌺, 🍜, 🏝️, 🌋, 🪷, 🦘, 🗽, 🍁, 💂, 🍺, 🗼, 🌷, 🏔️, 🪆, 🧿, ⚽, 🧉, 🌌, 🚀 手动切换, DIRECT], icon: "https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/macosicons/control-center.png"}  # 总切换入口，选择自动策略 / 地区组 / 手动切换 / 直连

  # ── 全部节点 / Proxy ──
  - {name: 🚀 手动切换,  type: select, include-all: true, filter: *FilterAll, icon: "https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/macosicons/network-utility.png"}  # 手动选择通过 FilterAll 净化后的手动节点及订阅节点

  # ── 自动选择 / Auto ──
  - {name: ♻️ 自动选择,   type: url-test, include-all: true, filter: *FilterAll, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 50, icon: "https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/macosicons/automator.png"}  # 测速选择低延迟节点，切换容差 50 毫秒

  # ── 故障转移 / Fallback ──
  - {name: 🔯 故障转移,  type: fallback, include-all: true, filter: *FilterAll, url: "https://www.gstatic.com/generate_204", interval: 300, icon: "https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/macosicons/time-machine.png"}  # 按节点顺序选择首个可用节点，故障时自动顺延

  # ── 负载均衡 / Load Balance ──
  - {name: 🔮 负载均衡,  type: load-balance, include-all: true, filter: *FilterAll, strategy: consistent-hashing, icon: "https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/macosicons/activity-monitor.png"}  # 按目标地址做一致性哈希，同一目标尽量固定出口

  # ── 下载均衡 / Download Balance ──
  - {name: ⚖️ 下载均衡,   type: load-balance, include-all: true, filter: *FilterAll, strategy: round-robin, icon: "https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/macosicons/downloads.png"}  # 轮询分配不同连接；当前为预留入口，尚未引用

  # ── 应用分流 / Proxy App ──
  - {name: ⚡ OpenAI,    type: select, proxies: [🎚️ 节点选择, DIRECT, REJECT, 🌆, 🧋, 🎰, ⛩️, 🎤, 🏙️, 🐘, 🌺, 🍜, 🏝️, 🌋, 🪷, 🦘, 🗽, 🍁, 💂, 🍺, 🗼, 🌷, 🏔️, 🪆, 🧿, ⚽, 🧉, 🌌], icon: "https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/macosicons/chatgpt.png"}  # OpenAI / ChatGPT 命中入口
