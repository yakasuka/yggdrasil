# =======================================================
# 6. 分流规则 Rules
# =======================================================

# 规则自上而下匹配，首次命中即停止；调整规则顺序会影响最终出口
# GEOSITE / GEOIP 使用客户端实际加载的数据版本；RULE-SET 引用第 7 节同名规则源
# no-resolve 表示此条 IP 规则不主动触发域名解析，已有目标 IP 时仍可匹配
rules:

  # ── 优先规则 / Priority ──
  - GEOSITE,adobe,🎨 Adobe                           # Adobe 专项分流，优先于后续国内直连及自定义补充规则
  - GEOSITE,private,DIRECT                           # 私有域名 / 局域网域名直连
  - GEOIP,private,DIRECT,no-resolve                  # 私有目标 IP 直连，不为此条规则额外解析域名

  # ── 自定义补充 / Custom ──
  - RULE-SET,🏮 Hearth,DIRECT                        # 自定义直连域名补充
  - RULE-SET,🏮 Hearth · IP,DIRECT                   # 自定义经典直连补充，上游含 IP / 源端口 / 目标端口规则
  - RULE-SET,🌌 Orbit,🎚️ 节点选择                     # 自定义代理域名补充，交由节点选择
  - RULE-SET,🌌 Orbit · IP,🎚️ 节点选择                # 自定义代理 IP 补充，交由节点选择

  # ── 国内直连 / Direct ──
  - GEOSITE,cn,DIRECT                                # 国内域名直连
  - GEOIP,cn,DIRECT,no-resolve                       # 国内目标 IP 直连，不为此条规则额外解析域名
  - GEOSITE,google-cn,DIRECT                         # Google 国内可直连类目

  # ── 游戏与下载 / Games ──
  - GEOSITE,steam@cn,DIRECT                          # Steam 中标记为 @cn 的域名直连
  - GEOSITE,category-game-platforms-download,DIRECT  # 游戏平台下载类目直连，优先于下方 Steam 通用规则
  - GEOSITE,steam,👾 Steam                           # 剩余 Steam 域名交由 Steam 策略组
  - GEOSITE,category-games,DIRECT                    # 剩余游戏类目直连，前置 Steam 专项规则优先
  - GEOSITE,category-public-tracker,DIRECT           # 公共 Tracker 域名直连

  # ── 应用与类目 / Services ──
  # - GEOSITE,Notion,📦 Notion                       # 可选 Notion 规则，启用前先定义对应策略组并确认分类可用
  - GEOSITE,telegram,🪽 Telegram                     # Telegram 专项分流，优先于通信类目
  - GEOSITE,openai,⚡ OpenAI                         # OpenAI / ChatGPT 专项分流
  - GEOSITE,anthropic,🪐 Anthropic                   # Anthropic / Claude 专项分流
  - GEOSITE,category-ai-!cn,✨ AI 服务               # 剩余海外 AI 类目分流
  - GEOSITE,apple,⚪ Apple                           # Apple 服务分流
  - GEOSITE,youtube,📺 YouTube                       # YouTube 专项分流，优先于 Google 通用规则
  - GEOSITE,netflix,🍿 Netflix                       # Netflix 专项分流
  - GEOSITE,tiktok,🎶 TikTok                         # TikTok 专项分流
  - GEOSITE,instagram,♾️ Meta                         # Instagram 交由 Meta 策略组
  - GEOSITE,twitter,𝕏 X                              # X / Twitter 专项分流
  - GEOSITE,github,🐙 GitHub                         # GitHub 专项分流
  - GEOSITE,category-speedtest,⚡ Speedtest          # 测速服务类目分流，范围不限于 Speedtest

  - GEOSITE,okx,🟦 OKX                               # OKX / 欧易专项分流
  - GEOSITE,binance,🟨 Binance                       # Binance / 币安专项分流
  - GEOSITE,bybit,🟪 Bybit                           # Bybit 专项分流
  - GEOSITE,category-communication,🎮 Discord        # 通信服务类目交由 Discord 策略组，已单列的 Telegram 优先
  - GEOSITE,category-social-media-!cn,🫂 Social      # 剩余海外社交类目分流，前置通信及专项规则优先
  # - GEOSITE,teamviewer,↔️ teamviewer                # 可选 TeamViewer 规则，启用前先定义对应策略组并确认分类可用
  - GEOSITE,cloudflare,☁️ Cloudflare                  # Cloudflare 通用分流，前置规则优先
  - GEOSITE,google,🧭 Google                         # Google 通用分流，前置规则优先
  - GEOSITE,microsoft,🪟 Microsoft                   # Microsoft 通用分流，前置规则优先

  # ── 通用代理 / Proxy ──
  - GEOSITE,gfw,🎚️ 节点选择                           # gfw 域名类目交由节点选择

  # ── 端口补充 / Ports ──
  - RULE-SET,🔌 Portal,🔌 特殊端口                   # 对尚未命中的流量应用端口规则，出口交由特殊端口组选择

  # ── 最终兜底 / Final ──
  - MATCH,🏁 Final                                   # 其余全部流量交由 Final 兜底


# =======================================================
# 7. 规则源 Rule Providers
# =======================================================

# ── 公共字段 / Rule Anchors ──
# 以下 YAML 锚点统一复用下载方式 / 匹配类型 / 文件格式 / 更新间隔
rule-anchor:
  domain:    &RP-domain    {type: http, behavior: domain,    format: yaml, interval: 28800}  # 域名型规则集，YAML 格式，每 28800 秒 / 8 小时更新
  classical: &RP-classical {type: http, behavior: classical, format: yaml, interval: 28800}  # 经典规则集，支持 IP / 端口等规则，YAML 格式，每 28800 秒 / 8 小时更新

# ── 规则订阅 / Rule Sources ──
# 规则源名称需与 RULE-SET 引用一致；实际匹配范围随上游内容更新
# Hearth · IP 使用 classical 格式，上游还包含端口规则，并非纯 IP 列表
# Portal 当前上游匹配 80 / 443 以外的目标端口；实际出口由特殊端口策略组选择
rule-providers:
  🏮 Hearth:      {<<: *RP-domain,    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml"}        # 自定义直连域名补充，命中后使用 DIRECT
  🏮 Hearth · IP: {<<: *RP-classical, url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml"}  # 自定义经典直连补充，包含 IP / 端口规则
  🌌 Orbit:       {<<: *RP-domain,    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml"}         # 自定义代理域名补充，命中后交由节点选择
  🌌 Orbit · IP:  {<<: *RP-classical, url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml"}   # 自定义代理 IP 补充，命中后交由节点选择
  🔌 Portal:      {<<: *RP-classical, url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml"}          # 自定义端口补充，命中后交由特殊端口策略组
