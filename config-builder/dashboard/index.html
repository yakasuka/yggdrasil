<!doctype html>
<!--
  GitHub Pages has no Functions, so /config-builder/dashboard is otherwise a 404.
  This static page is published ONLY by GitHub Pages: the Cloudflare Pages build
  (build-gateway.mjs) copies an explicit file allowlist and does not include
  config-builder/dashboard/, where the real dashboard is served by the Function
  at functions/config-builder/dashboard.js. Thus the two hosts never collide.

  On GitHub Pages this page redirects to the Cloudflare Pages dashboard. The
  Cloudflare origin is derived at runtime from the public meta tag on the config
  wizard, so changing the Pages domain there is enough - no second place to edit.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>配置管理</title>
    <style>
      :root{color-scheme:light dark;--page:#f5f5f7;--surface:#fff;--soft:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--line:#00000026;--accent:#005bb5;--action:#0071e3;--tint:#0071e314}
      @media(prefers-color-scheme:dark){:root{--page:#111113;--surface:#1c1c1e;--soft:#252527;--ink:#f5f5f7;--muted:#a1a1a7;--line:#ffffff17;--accent:#80baff;--action:#0071e3;--tint:#80baff12}}
      *{box-sizing:border-box}
      body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--page);color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
      .card{width:min(440px,100%);padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:0 12px 40px -24px #0003;text-align:center}
      .eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted)}
      h1{margin:10px 0 6px;font-size:22px;font-weight:600;letter-spacing:-.03em}
      p{margin:0 0 22px;color:var(--muted);font-size:13px}
      .spin{width:22px;height:22px;margin:0 auto 18px;border:2px solid var(--line);border-top-color:var(--action);border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .go{display:inline-block;padding:11px 20px;border-radius:99px;background:var(--action);color:#fff;font-weight:600;text-decoration:none}
      .go:hover{filter:brightness(1.06)}
      .hint{margin-top:16px;font-size:12px}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">YGGDRASIL · CONFIG STUDIO</div>
      <h1>配置管理</h1>
      <div class="spin" id="spin" aria-hidden="true"></div>
      <p id="msg">正在前往配置管理面板…</p>
      <a class="go" id="go" href="#" hidden>打开配置管理</a>
      <p class="hint" id="hint">若未自动跳转，请<a id="link" href="#">点击这里</a>。</p>
    </main>
    <script>
      (function () {
        "use strict";
        var msg = document.getElementById("msg");
        var spin = document.getElementById("spin");
        var go = document.getElementById("go");
        var link = document.getElementById("link");
        var hint = document.getElementById("hint");

        // The public Cloudflare Pages origin is declared once, in the wizard's
        // yggdrasil:public meta tag. Read it from ../index.html so there is a
        // single source of truth for the Pages domain.
        function fromMeta(cb) {
          fetch("../index.html", { cache: "no-store" })
            .then(function (r) { return r.ok ? r.text() : ""; })
            .then(function (html) {
              var m = html.match(/name=["']yggdrasil:public["']\s+content=["']([^"']+)["']/i) ||
                      html.match(/content=["']([^"']+)["']\s+name=["']yggdrasil:public["']/i);
              cb(m ? m[1].replace(/\/+$/, "") : "");
            })
            .catch(function () { cb(""); });
        }

        function show(target) {
          if (!target) {
            spin.hidden = true;
            msg.textContent = "无法自动获取配置管理地址。";
            hint.hidden = true;
            return;
          }
          go.href = target;
          link.href = target;
          go.hidden = false;
          location.replace(target);
        }

        // Fall back to the known Pages origin if the meta cannot be read.
        var FALLBACK = "https://yggdrasil-afx.pages.dev/config-builder";
        fromMeta(function (origin) {
          var base = origin || FALLBACK;
          show(base + "/dashboard");
        });

        // Never let the user hang if the fetch stalls.
        setTimeout(function () {
          if (go.hidden) show(FALLBACK + "/dashboard");
        }, 2500);
      })();
    </script>
  </body>
</html>
