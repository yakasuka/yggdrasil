name: Update AdGuard desktop rule providers

# Lazy by design: runs once a day, sends HEAD requests only, downloads a filter
# only when its ETag/Last-Modified changed, and commits only when the generated
# provider content actually differs. jsDelivr is purged only after real content
# changes so subscribers see the update immediately.
on:
  push:
    branches: [main]
    paths:
      - 'resources/rules/adguard/adguard-filters.json'
      - 'scripts/rules/generate-adguard-rules.mjs'
      - '.github/workflows/update-adguard-rules.yml'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Redownload every filter, ignoring ETag'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: adguard-desktop-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check upstream and rebuild only if needed
        id: gen
        run: node scripts/rules/generate-adguard-rules.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit changed rule files
        if: steps.gen.outputs.changed == 'true'
        run: |
          git add -- \
            resources/rules/adguard/Custom_AdGuard_Domain.yaml \
            resources/rules/adguard/.adguard-state.json
          if git diff --cached --quiet; then
            echo 'content unchanged, nothing to commit'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore(rules): update AdGuard desktop rule provider' \
              -m 'Changed filters: ${{ steps.gen.outputs.files }}' \
              -m 'Block: ${{ steps.gen.outputs.block }}'
          git push origin HEAD:main

      - name: Purge jsDelivr cache
        if: steps.gen.outputs.contentChanged == 'true'
        run: |
          echo "purging Custom_AdGuard_Domain.yaml"
          curl -fsS "https://purge.jsdelivr.net/gh/yakasuka/yggdrasil@main/resources/rules/adguard/Custom_AdGuard_Domain.yaml"
          echo
