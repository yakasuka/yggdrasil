name: Validate config-builder

# Only builder-owned paths trigger this workflow. YAML/rule updates on the
# main line must not rebuild or retest the frontend, and vice versa.
on:
  push:
    paths:
      - "config-builder/**"
      - "!config-builder/docs/**"
      - "functions/**"
      - "service.json"
      - "_redirects"
      - "_routes.json"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "config-builder/**"
      - "!config-builder/docs/**"
      - "functions/**"
      - "service.json"
      - "_redirects"
      - "_routes.json"
      - ".github/workflows/check.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config-builder/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
