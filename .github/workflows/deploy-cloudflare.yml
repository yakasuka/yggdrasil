name: Deploy Cloudflare Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: config-builder
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERVICE_BASE_URL: ${{ vars.SERVICE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config-builder/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Require the account and the service address
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure CLOUDFLARE_API_TOKEN first.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure CLOUDFLARE_ACCOUNT_ID first.'; exit 1; }
          test -n "$SERVICE_BASE_URL" || { echo 'Set repository variable SERVICE_BASE_URL to your self-hosted service origin.'; exit 1; }
          echo 'Cloudflare Pages only publishes static files. No KV binding or Functions business logic is required.'
          echo 'Also set SERVICE_BASE_URL in the Cloudflare Pages project variables for Git-integrated builds and functions/ redirects.'
      - run: npm run service:deploy -- --branch main
