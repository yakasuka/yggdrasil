name: Call self-hosted service

# Smoke-tests the public self-hosted subscription API from GitHub Actions.
# Only status codes and link templates are printed; no subscription content is
# stored in the repository or in logs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the links the backend emits
        env:
          SERVICE_BASE_URL: ${{ vars.SERVICE_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_BASE_URL" || {
            echo "Set repository variable SERVICE_BASE_URL first.";
            exit 1;
          }
          echo "== /api/status =="
          curl -sS --max-time 15 -o /dev/null -w "HTTP %{http_code}\n" \
            "$SERVICE_BASE_URL/api/status"
          echo "== /api/endpoints =="
          curl -sS --max-time 15 "$SERVICE_BASE_URL/api/endpoints" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(f"{k}: {d[k]}" for k in ("service","create","subscription") if k in d))'
