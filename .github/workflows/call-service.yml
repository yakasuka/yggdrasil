name: Call self-hosted service

# Lets GitHub invoke the merge / sub links that the backend emits, without
# ever storing node content in the repository. Only status codes and the
# link template are printed; responses containing nodes are discarded.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read the links the backend emits
        env:
          SERVICE_BASE_URL: ${{ vars.SERVICE_BASE_URL }}
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_BASE_URL" || {
            echo "Set repository variable SERVICE_BASE_URL first.";
            exit 1;
          }
          echo "== /api/status =="
          curl -sS --max-time 15 -o /dev/null -w "HTTP %{http_code}\n" \
            "$SERVICE_BASE_URL/api/status"
          echo "== /api/endpoints =="
          curl -sS --max-time 15 "$SERVICE_BASE_URL/api/endpoints" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(f"{k}: {d[k]}" for k in ("service","merge","sub","subscription") if k in d))'
          if [ -n "${SERVICE_TOKEN:-}" ]; then
            for path in merge sub; do
              echo "== /$path =="
              curl -sS --max-time 20 -o /dev/null -w "HTTP %{http_code}\n" \
                "$SERVICE_BASE_URL/$path?token=$SERVICE_TOKEN"
            done
          else
            echo "SERVICE_TOKEN secret is unset; skipped authenticated merge/sub calls."
          fi
