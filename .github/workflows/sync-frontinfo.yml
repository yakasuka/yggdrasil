name: Sync dashboard front-end edits to repository

# The owner edits the Ratatoskr YAML template from the dashboard. The backend
# keeps the edit as a draft and exposes it read-only at GET /api/frontinfo.
# This workflow pulls that draft with plain HTTPS (no PAT, no backend-held
# GitHub credential), writes it to resources/template/ratatoskr-template.yaml,
# rebuilds the derived catalog, and commits with the built-in GITHUB_TOKEN.

on:
  schedule:
    # Every 15 minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-frontinfo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config-builder/package-lock.json

      - name: Install
        run: npm ci
        working-directory: config-builder

      - name: Pull draft from service and apply if changed
        id: draft
        env:
          # Configured by the owner after the service is deployed. Falls back
          # to the project's default service origin.
          SERVICE_BASE_URL: ${{ vars.SERVICE_BASE_URL || 'https://yggdrasil.xyang.cyou' }}
        run: |
          set -euo pipefail
          base="${SERVICE_BASE_URL%/}"
          echo "Pulling front-end draft from $base/api/frontinfo"
          http=$(curl -sS --max-time 25 -o /tmp/frontinfo.json -w '%{http_code}' "$base/api/frontinfo" || echo 000)
          if [ "$http" = "204" ]; then
            echo "No pending draft. Nothing to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$http" != "200" ]; then
            echo "::warning::Could not fetch draft (HTTP $http). Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import { catalogFromYaml } from "./config-builder/shared/catalog-from-yaml.js";
          import { BOM, stripBom } from "./config-builder/scripts/template-io.mjs";

          const draft = JSON.parse(await readFile("/tmp/frontinfo.json", "utf8"));
          const incoming = stripBom(draft.text || "");
          if (!incoming.trim()) throw new Error("Draft template is empty.");

          // Validate with the exact generator the build uses. A broken draft
          // must never be committed.
          await catalogFromYaml(incoming);

          const target = "resources/template/ratatoskr-template.yaml";
          const current = stripBom(await readFile(target, "utf8"));
          if (current === incoming) {
            console.log("Draft matches the committed template. Nothing to sync.");
            process.exit(0);
          }

          // Preserve the project's BOM + CRLF convention.
          const crlf = incoming.replace(/\r\n/g, "\n").replace(/\n/g, "\r\n");
          await writeFile(target, BOM + crlf, "utf8");
          await writeFile("/tmp/frontinfo.changed", "1", "utf8");
          console.log("Applied front-end draft to", target);
          NODE

          if [ -f /tmp/frontinfo.changed ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild derived catalog
        if: steps.draft.outputs.changed == 'true'
        run: npm run catalog
        working-directory: config-builder

      - name: Commit template and derived catalog
        if: steps.draft.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/template/ratatoskr-template.yaml config-builder/shared/catalog.json
          if git diff --cached --quiet; then
            echo "No file changes after rebuild."
            exit 0
          fi
          git commit -m "chore: apply dashboard front-end edits [skip ci]"
          git push
