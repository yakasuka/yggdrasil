name: Sync static frontend to GitHub Pages

# GitHub Pages publishes the repository root, not a build directory. This
# workflow rebuilds the shared bundle and commits the generated static files
# so both hosts serve exactly the same frontend. No node data is ever written
# into the repository.
on:
  push:
    branches: [main]
    paths:
      - "config-builder/src/**"
      - "config-builder/shared/**"
      - "config-builder/scripts/**"
      - "config-builder/index.html"
      - "config-builder/package.json"
      - "config-builder/package-lock.json"
      - ".github/workflows/sync-static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-static-frontend
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: config-builder/package-lock.json
      - name: Install
        run: npm ci
        working-directory: config-builder
      - name: Build shared static bundle
        id: bundle
        working-directory: config-builder
        env:
          SERVICE_BASE_URL: ${{ vars.SERVICE_BASE_URL }}
        run: |
          # The backend origin is configured by the owner after the service is
          # deployed. Until then, still build (tests need dist/) but do not
          # rewrite service.json or the merge/sub relay pages with an empty URL.
          if [ -z "$SERVICE_BASE_URL" ]; then
            echo "::warning::SERVICE_BASE_URL is not set yet. Build and tests still run; static sync is skipped until the self-hosted backend origin is configured."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          npm run build
      - name: Test
        run: npm test
        working-directory: config-builder
      - name: Commit generated static assets
        if: steps.bundle.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config-builder/index.html \
                  config-builder/assets/app.js \
                  config-builder/assets/app.css \
                  merge/index.html \
                  sub/index.html \
                  service.json
          if git diff --cached --quiet; then
            echo "Static assets already up to date."
            exit 0
          fi
          git commit -m "chore: sync static frontend for both hosts [skip ci]"
          git push
