# =======================================================
# 6. 分流规则 Rules
# =======================================================

# 规则自上而下匹配，首次命中即停止；调整规则顺序会影响最终出口
# GEOSITE / GEOIP 使用客户端实际加载的数据版本；RULE-SET 引用第 7 节同名规则源
# no-resolve 表示此条 IP 规则不主动触发域名解析，已有目标 IP 时仍可匹配

rules:

  # ── 优先规则 / Priority ──
  - GEOSITE,adobe,🎨 Adobe
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # ── 自定义补充 / Custom ──
  - RULE-SET,↘️ Direct Domain,DIRECT
  - RULE-SET,📍 Direct IP,DIRECT
  - RULE-SET,🌍 Proxy Domain,🎚️ 节点选择
  - RULE-SET,🛰️ Proxy IP,🎚️ 节点选择

  # ── 国内流量直连 / China Direct ──
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT
  - GEOIP,cn,DIRECT,no-resolve
  - GEOSITE,google-cn,DIRECT

  # ── 游戏与下载 / Games ──
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,👾 Steam
  - GEOSITE,epicgames,🎁 Epic
  - GEOSITE,taptap,🕹️ TapTap
  - GEOSITE,category-games,DIRECT
  - GEOSITE,category-game-platforms-download,DIRECT
  - GEOSITE,category-public-tracker,DIRECT

  # ── 流媒体 / Streaming ──
  - GEOSITE,netflix,🍿 Netflix
  - GEOSITE,hulu,📺 Hulu
  - GEOSITE,primevideo,📦 Prime Video
  - GEOSITE,hbo,🎬 HBO
  - GEOSITE,disney,🏰 Disney+
  - GEOSITE,twitch,🟣 Twitch
  - GEOSITE,spotify,💚 Spotify
  - GEOSITE,bilibili,📺 Bilibili

  # ── 应用与类目 / Services ──
#  - GEOSITE,Notion,📦 Notion
  - GEOSITE,telegram,🪽 Telegram
  - GEOSITE,openai,⚡ OpenAI
  - GEOSITE,anthropic,🪐 Anthropic
  - GEOSITE,category-ai-!cn,✨ AI 服务
  - GEOSITE,apple,⚪ Apple
  - GEOSITE,youtube,📺 YouTube
  - GEOSITE,tiktok,🎶 TikTok
  - GEOSITE,instagram,♾️ Meta
  - GEOSITE,twitter,𝕏 X
  - GEOSITE,github,🐙 GitHub
  - GEOSITE,category-speedtest,⚡ Speedtest
  - GEOSITE,okx,🟦 OKX
  - GEOSITE,binance,🟨 Binance
  - GEOSITE,bybit,🟪 Bybit
  - GEOSITE,discord,🎮 Discord
  - GEOSITE,category-communication,💬 Chat
  - GEOSITE,category-social-media-!cn,🫂 Social
#  - GEOSITE,teamviewer,↔️ teamviewer
  - GEOSITE,cloudflare,☁️ Cloudflare
  - GEOSITE,google,🧭 Google
  - GEOSITE,microsoft,🪟 Microsoft
  - GEOSITE,category-cryptocurrency,🪙 Crypto
  - GEOSITE,amazon,📦 Amazon

  - GEOSITE,category-media,📰 News
  - GEOSITE,category-entertainment,🍿 Entertainment

  # ── 端口补充 / Ports ──
  - RULE-SET,🔀 Port Rules,🔌 特殊端口

  # ── 通用代理 / Proxy ──
  - GEOSITE,gfw,🎚️ 节点选择

  # ── 最终兜底 / Final ──
  - MATCH,🏁 Final
# =======================================================
# 7. 规则源 Rule Providers
# =======================================================

# ── 规则源公共字段 ──
rule-anchor:
  domain:    &RP-domain    {type: http, behavior: domain,    format: yaml, interval: 28800}
  classical: &RP-classical {type: http, behavior: classical, format: yaml, interval: 28800}

rule-providers:
  ↘️ Direct Domain:       {<<: *RP-domain,    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml"}
  📍 Direct IP:           {<<: *RP-classical, url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml"}
  🌍 Proxy Domain:        {<<: *RP-domain,    url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml"}
  🛰️ Proxy IP:            {<<: *RP-classical, url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml"}
  🔀 Port Rules:         {<<: *RP-classical, url: "https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml"}
