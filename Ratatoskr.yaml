# =======================================================
# 1. 远程节点调用 Proxy Providers
# =======================================================

# ── 手动订阅示例 / Manual Providers ──
# 手动启用时取消下方整段注释；添加机场时复制 xyang 层级，并修改订阅名称保证唯一
# url 填写实际节点订阅地址；支持的订阅格式以当前 Mihomo 内核为准
# proxy-providers:  # 远程节点订阅入口
#   xyang:  # 订阅名称，供策略组引用或自动汇入使用
#     url: "https://example.com/sub?token=YOUR_SUBSCRIPTION_TOKEN"  # 机场提供的节点订阅地址
#     type: http  # HTTP 型订阅，下载远程节点内容
#     interval: 86400  # 订阅更新间隔：86400 秒 / 24 小时
#     health-check: {enable: true, lazy: true, url: "https://www.gstatic.com/generate_204", interval: 3600}  # 启用延迟测试，间隔 3600 秒；lazy 表示未使用时不主动定时测速
#     proxy: DIRECT  # 订阅下载 / 更新使用的出口：直连


proxy-providers:
   xyang:                                                                                    # 订阅链接，如需多个订阅请复制整段 并修改 provider1 字段 保证唯一性
     url: "https://yggdrasil-afx.pages.dev/sub?token=xxxx"
     type: http
     interval: 86400
     health-check: {enable: true, lazy: true, url: "https://www.gstatic.com/generate_204",interval: 3600}
     proxy: DIRECT

# ── 自动订阅区域 / Auto Providers ──
# 预留自动写入区域；使用自动注入功能时保留下面的起止标记

# >>> AUTO-PROVIDERS-START

# <<< AUTO-PROVIDERS-END

# =======================================================
# 2. 基础设置 General
# =======================================================

port: 7890                           # HTTP 代理端口
socks-port: 7891                     # SOCKS5 代理端口
allow-lan: true                      # 允许局域网设备访问代理端口
mode: rule                           # 规则模式，按下方 rules 列表分流
log-level: info                      # 日志级别：info，记录一般运行及连接信息
external-controller: 127.0.0.1:9090  # REST API 监听地址：仅本机访问
unified-delay: true

# =======================================================
# 3. 手动节点 Proxies
# =======================================================

# 下方仅为节点名称占位，当前整段未启用
# 启用时取消注释，并补全 type / server / port 及对应协议参数；多个节点的 name 需保持唯一

# proxies:                                                                                       # 手动节点，如需多个手动节点请复制整段 并修改 name 字段 保证唯一性
#  - name: "手动节点1"
#  - name: "手动节点2"

# =======================================================
# 4. 节点筛选 Node Filters
# =======================================================

# ── 地区匹配 / Regions ──
# 以下为 YAML 正则锚点，供策略组的 filter 引用；按节点名称匹配，忽略英文大小写
# 各地区正则排除名称以 => 开头的节点；地区代码支持末尾紧跟数字
# 按节点名称独立筛选；名称含多个地区标记时可能进入多个组，实际落地以机场标注为准
# ── 地区节点匹配正则 支持国旗 / 中英文 / 地区代码 排除带有 "=>" 前缀的落地节点 ──

FilterHK: &FilterHK '(?i)^(?!=>).*(?:🇭🇰|香港|Hong\s?Kong|\b(?:HK|HKG)\d*\b)'
FilterTW: &FilterTW '(?i)^(?!=>).*(?:🇹🇼|台湾|Tai(?:wan)?|\b(?:TW|TWN)\d*\b)'
FilterJP: &FilterJP '(?i)^(?!=>).*(?:🇯🇵|日本|川日|东京|大阪|埼玉|Japan|\b(?:JP|JPN)\d*\b)'
FilterKR: &FilterKR '(?i)^(?!=>).*(?:🇰🇷|韩国|韓|首尔|Korea|\b(?:KR|KOR)\d*\b)'
FilterSG: &FilterSG '(?i)^(?!=>).*(?:🇸🇬|新加坡|狮|Singapore|\b(?:SG|SGP)\d*\b)'
FilterUS: &FilterUS '(?i)^(?!=>).*(?:🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|拉斯维加斯|United States|\b(?:US|USA)\d*\b)'

# ── 节点净化 / Clean Filter ──
# 按名称排除广告 / 流量 / 到期等关键词，以及名称任意位置的 => 标记
# 仅作用于显式引用此锚点的策略组；匹配关键词的真实节点也会被过滤
FilterAll: &FilterAll '^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$'

# ── 其他地区 / Others ──
# 应用 FilterAll 的节点净化，并排除以上 24 个已分类国家 / 地区
FilterOthers: &FilterOthers '^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$'

# =======================================================
# 5. 策略组 Proxy Groups
# =======================================================

# include-all 汇入手动节点及订阅节点；filter 仅在当前组内按节点名称筛选
# select 为手动选择，首项为初始选项；标注预留的策略组当前未被规则或其他策略组引用
# 应用范围由下方 rules 实际命中决定；图标使用 macOSicons PNG，来源见 icons/macosicons/manifest.json

# ── 策略组 ──
proxy-groups:

  # ── 策略入口 / Switch ──
  - {name: 🎚️ 节点选择, type: select, proxies: [🚀 手动切换, ♻️ 自动选择, 🔯 故障转移, 🔮 负载均衡, 🌆, 🧋, ⛩️, 🎤, 🏙️, 🗽, 🌌, DIRECT]}

  # ── 全部节点 / Proxy ──
  - {name: 🚀 手动切换, type: select, include-all: true, filter: *FilterAll, icon: "https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/proxy.png"}                                            # 全部节点手动选择入口

  # ── 自动选择 / Auto ──
  - {name: ♻️ 自动选择, type: url-test, include-all: true, filter: *FilterAll, url: "https://www.gstatic.com/generate_204", interval: 300, tolerance: 50}

  # ── 故障转移 / Fallback ──
  - {name: 🔯 故障转移, type: fallback, include-all: true, filter: *FilterAll, url: "https://www.gstatic.com/generate_204", interval: 300}

  # ── 负载均衡 / Load Balance ──
  - {name: 🔮 负载均衡, type: load-balance, include-all: true, filter: *FilterAll, strategy: consistent-hashing, icon: "https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/tracking.png"}   # 域名专用负载均衡入口

