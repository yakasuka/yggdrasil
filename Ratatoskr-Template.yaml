# Ratatoskr · Configurator 唯一目录来源
# 新增 APP：添加 select 策略组，并在 rules 中引用该组；可用 x-configurator.category 指定分类。
# 新增地区：添加地区组，提供 x-configurator: {kind: region, id: XX, label: 地区, flag: 🌐} 和 filter。
# 不在本文件填写个人机场 URL、节点或凭据。
x-configurator:
  schema: 1
  testUrl: https://www.gstatic.com/generate_204
  groups:
    gateway: 🎚️ 节点选择
    manual: 🚀 手动切换
    final: 🏁 Final
    other: 🌌
    ports: 🔌 特殊端口
FilterAll: ^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$
proxy-providers: {}
proxy-groups:
  - name: 🎚️ 节点选择
    type: select
    proxies:
      - 🚀 手动切换
      - ♻️ 自动选择
      - 🔯 故障转移
      - 🔮 负载均衡
      - 🌆
      - 🧋
      - ⛩️
      - 🎤
      - 🏙️
      - 🗽
      - 🌌
      - DIRECT
    icon: https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/switch.png
  - name: 🚀 手动切换
    type: select
    include-all: true
    filter: ^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$
    icon: https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/proxy.png
  - name: ♻️ 自动选择
    type: url-test
    include-all: true
    filter: ^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/proxy.png
    x-configurator:
      kind: strategy
      id: auto
  - name: 🔯 故障转移
    type: fallback
    include-all: true
    filter: ^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$
    url: https://www.gstatic.com/generate_204
    interval: 300
    icon: https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/fallback.png
    x-configurator:
      kind: strategy
      id: fallback
  - name: 🔮 负载均衡
    type: load-balance
    include-all: true
    filter: ^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$
    strategy: consistent-hashing
    icon: https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/tracking.png
    x-configurator:
      kind: strategy
      id: balanced
  - name: 📦 下载均衡
    type: load-balance
    include-all: true
    filter: ^(?!.*(?:(?i)=>|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|剩余流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\d{4}-\d{2}-\d{2}|\d+G)).*$
    strategy: round-robin
    icon: https://raw.githubusercontent.com/yakasuka/yggdrasil/main/icons/global.png
    x-configurator:
      kind: strategy
      id: download
